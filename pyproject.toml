[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longform-music-studio"
version = "0.12.0"
description = "Professional long-form background music production desktop app for video creators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LongForm Music Studio Project" }]
keywords = ["music", "generator", "ambient", "youtube", "background", "audio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
audio = [
    "soundfile>=0.12",
    "sounddevice>=0.4",
]
gui = [
    "PySide6>=6.6",
]
ai = [
    "requests>=2.31",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["lfms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
